      <stop offset=".70" stop-color="#1292EE"/>
      <stop offset="1" stop-color="#00CBFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="26" fill="url(#glowRight)"/>
  <rect width="1200" height="300" rx="26" fill="url(#glowLeft)"/>

  <path d="M72 74H250" stroke="#00CBFF" stroke-opacity=".30" stroke-width="2" stroke-linecap="round"/>
