<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050B14"/>
      <stop offset="0.42" stop-color="#071827"/>
      <stop offset="0.72" stop-color="#0A2742"/>
      <stop offset="1" stop-color="#0B3A60"/>
    </linearGradient>

    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientTransform="translate(1010 50) rotate(135) scale(250)">
      <stop stop-color="#007BDF" stop-opacity=".30"/>
